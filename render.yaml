services:
  - type: web
    name: espresso-tracker-backend
    env: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: espresso-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: espresso-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: espresso-db
          property: password
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: espresso-tracker-frontend
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    envVars:
      - key: VITE_API_URL
        value: https://espresso-tracker-backend.onrender.com

databases:
  - name: espresso-db
    plan: free
    databaseName: espresso_tracker